name: CI/CD Pipeline & GitHub Pages Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==========================================
  # STAGE 1 & 2: CONTINUOUS INTEGRATION (CI)
  # ==========================================
  test:
    name: "CI: Lint & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Automated Test Suite
        run: |
          echo "⚡ Running automated test suite..."
          python3 -m unittest discover -s tests -p "test_*.py" -v

  # ==========================================
  # STAGE 3 & 4: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  deploy:
    name: "CD: Build & Deploy to GitHub Pages"
    needs: test
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Build Metadata into Website
        run: |
          echo "📦 Injecting CI/CD build metadata..."
          BUILD_NUM="BUILD_#${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Replace placeholder strings with actual CI run variables
          sed -i "s|BUILD_#LOCAL_DEV|$BUILD_NUM|g" index.html
          sed -i "s|HEAD (local)|$SHORT_SHA|g" index.html
          sed -i "s|Just Now|$BUILD_DATE|g" index.html

          echo "✅ Injected Build: $BUILD_NUM ($SHORT_SHA) at $BUILD_DATE"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
