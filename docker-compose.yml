services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: cicd-test-website:latest
    container_name: cicd-test-website
    restart: always
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
